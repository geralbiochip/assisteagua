<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title"><title id="title">Painéis fotovoltaicos e inversor — produção de eletricidade</title><defs><linearGradient id="wall" x1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e7f2f9"/></linearGradient><linearGradient id="metal" x1="0" x2="1"><stop stop-color="#fff"/><stop offset=".7" stop-color="#f7fbfe"/><stop offset="1" stop-color="#cfdfeb"/></linearGradient><linearGradient id="glass" x1="0" x2="1" y2="1"><stop stop-color="#c1e8fa"/><stop offset="1" stop-color="#eaf7ff"/></linearGradient><filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#214c6e" flood-opacity=".10"/></filter></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.water{stroke-dasharray:4 22;animation:flow 3s linear infinite}.warm{stroke:#d9805d}.cold{stroke:#36a7d1}.soft{fill:none;stroke-linecap:round;stroke-linejoin:round}.spin{transform-origin:0px 0px;animation:spin 4s linear infinite}.air{stroke-dasharray:12 32;animation:flow 5s linear infinite;opacity:.55}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-104}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="480" rx="28" fill="#edf5fa"/><circle class="pulse" cx="579" cy="89" r="46" fill="#ffe19a"/><path d="M116 374V226H447V374Z" fill="url(#wall)" stroke="#c4dbe9" stroke-width="2"/><path d="M80 235L281 103L478 235Z" fill="#315c7c"/><ellipse cx="357" cy="413" rx="282" ry="18" fill="#d2e4ef"/><path d="M154 206L292 116L415 201L273 287Z" fill="#d3e9f6" stroke="#9dc2dc" stroke-width="3"/><path d="M168 204L291 129L400 201L274 274Z" fill="#0b4f8a"/><path d="M195 187l104 71m-77-88 103 73m-77-89 102 72m-76-89 102 73M191 219l122-75m-98 92 122-76m-96 93 120-77" stroke="#a7cee6" fill="none" stroke-width="1.5"/><rect x="504" y="239" width="106" height="