<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>AssisteÁgua — Imagem animada</title><style>body{margin:0;background:#f4f8fb;color:#0b4f8a;font:16px/1.6 Arial}main{max-width:1200px;margin:auto;padding:24px}img{width:100%;height:auto;display:block;border-radius:18px;background:white}button{margin:16px 0;background:#087fa8;color:white;border:0;padding:11px 18px;border-radius:6px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #0b4f8a;outline-offset:3px}p{font-size:14px}</style></head><body><main><h1>Conforto da habitação</h1><img id="demo" src="images/conforto-casa.svg" alt="Ilustração conceptual de uma casa com energia solar, água quente e climatização"><button id="pause" aria-pressed="false" type="button">Mostrar versão sem animação</button><p>Pré-visualização da substituição da imagem partilhada do site. O movimento também é desativado automaticamente quando o navegador indica preferência por movimento reduzido.</p></main><script>const img=document.getElementById('demo'),btn=document.getElementById('pause');btn.addEventListener('click',()=>{const paused=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',String(paused));img.src=paused?'images/conforto-casa-estatica.jpg':'images/conforto-casa.svg';btn.textContent=paused?'Mostrar animação':'Mostrar versão sem animação';});</script></body></html>
